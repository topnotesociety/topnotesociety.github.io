<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluent in Scent: Citrus practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F6F5F3; --accent:#E4E3E0; --paper:#FFFFFF;
  --ink:#2B2B2B; --label:#6F6F6F; --rule:#A3A3A3; --line:#D8D6D2;
  --good:#4A6646; --bad:#8C4A3C;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Poppins","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#1B1B1A; --accent:#272725; --paper:#2C2C2A;
    --ink:#ECEAE6; --label:#A9A7A2; --rule:#73716D; --line:#3B3A37;
    --good:#A3BF9C; --bad:#DBA193;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#1B1B1A; --accent:#272725; --paper:#2C2C2A;
  --ink:#ECEAE6; --label:#A9A7A2; --rule:#73716D; --line:#3B3A37;
  --good:#A3BF9C; --bad:#DBA193;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.6;
}
.wrap{max-width:34rem; margin:0 auto; padding:28px 22px 56px}
.brand{
  font-family:var(--sans); font-weight:300; font-size:11px;
  letter-spacing:.34em; text-transform:uppercase; color:var(--label);
  display:block; text-decoration:none;
}
.tag{
  font-family:var(--sans); font-weight:300; font-size:11px;
  letter-spacing:.24em; text-transform:uppercase; color:var(--label); margin:0;
}
h1{font-weight:400; font-size:2.5rem; line-height:1.1; margin:.2em 0 .3em; letter-spacing:-.01em}
h1.small{font-size:1.9rem}
h2{font-weight:500; font-size:1.2rem; margin:0}
p{margin:0 0 1em}
.lead{font-size:1.08rem}
.quiet{color:var(--label); font-size:.92rem}
.sans{font-family:var(--sans); font-weight:300}
a{color:inherit}
hr{border:0; border-top:1px solid var(--line); margin:28px 0}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

/* hero: five smelling strips */
.strips{position:relative; height:196px; margin:34px 0 10px; padding-left:64px; display:flex}
.strip{
  width:30px; height:190px; margin-left:-5px; flex:none; position:relative;
  background:var(--paper); border:1px solid var(--line); border-radius:2px;
  transform-origin:50% 118%; transform:rotate(var(--r));
  animation:fan .9s cubic-bezier(.2,.7,.2,1) both;
}
.strip::before{
  content:""; position:absolute; inset:0 0 auto 0; height:46%;
  background:linear-gradient(to bottom,var(--tint),transparent); opacity:.6; border-radius:1px;
}
a.strip{display:block; text-decoration:none; cursor:pointer}
a.strip:hover{border-color:var(--rule)}
.hint{font-family:var(--sans); font-weight:300; font-size:.82rem; color:var(--label); margin:0 0 26px}
.pstrip{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:2px; padding:12px 14px 10px 58px; margin-top:12px}
.pstrip::before{content:""; position:absolute; inset:0 auto 0 0; width:34%; background:linear-gradient(to right,var(--tint),transparent); opacity:.6; pointer-events:none}
.pstrip label{position:relative; display:block; font-style:italic; color:var(--label); font-size:.95rem}
.pstrip textarea{position:relative; display:block; width:100%; border:0; background:transparent; resize:vertical; font-family:var(--serif); font-size:1.1rem; line-height:1.5; color:var(--ink); padding:2px 0; min-height:3.4em}
.pstrip textarea::placeholder{color:var(--rule); font-style:italic}
.pstrip textarea:focus{outline:none}
.pstrip:focus-within{border-color:var(--ink)}
.pro{margin:8px 0 0 58px; font-size:.95rem; color:var(--label)}
.pro strong{color:var(--ink); font-weight:500}
.strip span{
  position:absolute; bottom:12px; left:50%;
  writing-mode:vertical-rl; transform:translateX(-50%) rotate(180deg);
  font-style:italic; font-size:13px; white-space:nowrap; color:var(--label);
}
@keyframes fan{from{transform:rotate(0)}to{transform:rotate(var(--r))}}
@media (prefers-reduced-motion: reduce){.strip{animation:none}}

/* exercise list on the start page */
.list{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.list li{border-bottom:1px solid var(--line)}
.list a{display:grid; grid-template-columns:4.4rem 1fr; gap:2px 10px; padding:16px 0; text-decoration:none}
.list .step{font-family:var(--sans); font-weight:300; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--label); padding-top:.5em}
.list .name{font-size:1.25rem; line-height:1.3}
.list .what{grid-column:2; color:var(--label); font-size:.95rem}
.list .status{grid-column:2; font-family:var(--sans); font-weight:300; font-size:.8rem; color:var(--ink); margin-top:4px}
.list a:hover .name{text-decoration:underline; text-underline-offset:4px}

/* shared controls */
.back{font-family:var(--sans); font-weight:300; font-size:.85rem; color:var(--label); text-decoration:none; display:inline-block; padding:6px 0; margin-bottom:18px}
.back:hover{color:var(--ink)}
button{font:inherit; color:inherit; cursor:pointer}
.btn{
  font-family:var(--sans); font-weight:400; font-size:.9rem;
  background:var(--ink); color:var(--page); border:1px solid var(--ink);
  border-radius:3px; padding:13px 20px; min-height:48px;
}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--rule)}
.btn:disabled{opacity:.35; cursor:default}
.row{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.progress{font-family:var(--sans); font-weight:300; font-size:.82rem; color:var(--label); margin:0 0 22px}
.prompt{font-size:1.45rem; line-height:1.35; margin:6px 0 24px; font-style:italic}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{
  background:var(--paper); border:1px solid var(--line); border-radius:3px;
  padding:16px 12px; min-height:60px; font-size:1.1rem; text-align:center;
}
.opt:hover:not(:disabled){border-color:var(--rule)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); color:var(--good)}
.opt.wrong{border-color:var(--bad); color:var(--bad); text-decoration:line-through}
.opt.dim{opacity:.45}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--tint); margin-right:8px; border:1px solid var(--line)}
.note{background:var(--accent); padding:14px 16px; border-radius:3px; margin-top:18px}
.note p:last-child{margin-bottom:0}
.note .verdict{font-family:var(--sans); font-weight:400; font-size:.82rem; margin-bottom:4px}
.note .verdict.ok{color:var(--good)} .note .verdict.no{color:var(--bad)}
.big{font-size:2rem; line-height:1.2; margin:.2em 0 .5em}
dl.words{margin:0}
dl.words div{display:grid; grid-template-columns:7.2rem 1fr; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
dl.words dt{font-weight:500}
dl.words dd{margin:0; color:var(--label)}
details{margin-top:34px; border-top:1px solid var(--rule); padding-top:14px}
summary{cursor:pointer; font-family:var(--sans); font-weight:300; font-size:.9rem; padding:6px 0}

/* intensity scale */
.oil{padding:20px 0; border-bottom:1px solid var(--line)}
.axis{display:grid; grid-template-columns:4.6rem 1fr; align-items:center; margin-top:8px}
.axis .ax{font-family:var(--sans); font-weight:300; font-size:.85rem; color:var(--label)}
.dots{display:flex; gap:4px}
.d{
  width:44px; height:44px; flex:none; border:0; background:none; padding:0;
  display:grid; place-items:center; font-family:var(--sans); font-weight:300; font-size:.8rem; color:var(--label);
}
.d i{
  width:30px; height:30px; border-radius:50%; border:1px solid var(--rule);
  display:grid; place-items:center; font-style:normal; background:var(--paper);
}
.d[aria-pressed="true"] i{background:var(--ink); border-color:var(--ink); color:var(--page)}
.d.was i{box-shadow:0 0 0 3px var(--page),0 0 0 4px var(--rule)}

/* blind test */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  background:var(--paper); border:1px solid var(--line); border-radius:999px;
  padding:9px 14px; min-height:42px; font-size:.98rem;
}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--page)}
.chip:disabled{opacity:.35; cursor:default}
.field{margin:22px 0 10px}
.check{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.check li{padding:14px 0; border-bottom:1px solid var(--line)}
.check .guess{font-size:1.15rem}
.check .w{color:var(--label); font-size:.95rem; font-style:italic}
.yn{display:flex; gap:8px; margin-top:10px}
.yn button{flex:1; background:var(--paper); border:1px solid var(--line); border-radius:3px; min-height:44px; font-family:var(--sans); font-weight:300; font-size:.88rem}
.yn button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--page)}
.hist{list-style:none; margin:10px 0 0; padding:0}
.hist li{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:.98rem}

/* review dates */
.rev{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.rev li{display:grid; grid-template-columns:1fr auto; gap:4px 14px; padding:16px 0; border-bottom:1px solid var(--line)}
.rev .when{font-family:var(--sans); font-weight:300; font-size:.8rem; color:var(--label)}
.rev .date{font-size:1.2rem}
.rev .todo{grid-column:1; color:var(--label); font-size:.95rem}
.rev .due{font-family:var(--sans); font-weight:400; font-size:.8rem}
.rev li.done .date,.rev li.done .todo{text-decoration:line-through; color:var(--rule)}
.rev label{grid-row:1 / span 3; grid-column:2; align-self:center; display:flex; align-items:center; gap:8px; font-family:var(--sans); font-weight:300; font-size:.85rem; min-height:44px; cursor:pointer}
.rev input[type=checkbox]{width:22px; height:22px; accent-color:var(--ink)}
input[type=date]{font-family:var(--sans); font-weight:300; font-size:1rem; padding:11px 12px; border:1px solid var(--rule); border-radius:3px; background:var(--paper); color:var(--ink); min-height:48px}

footer{margin-top:48px; padding-top:22px; border-top:1px solid var(--line)}
footer p{font-size:.9rem; color:var(--label)}
.link{background:none; border:0; padding:0; text-decoration:underline; text-underline-offset:3px; color:var(--label); font-size:.9rem; min-height:44px}
.course{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.course li{display:grid; grid-template-columns:4.4rem 1fr; gap:2px 10px; padding:14px 0; border-bottom:1px solid var(--line)}
.course .lvl{font-family:var(--sans); font-weight:300; font-size:.85rem; color:var(--label); padding-top:.25em}
.course .name{font-size:1.15rem}
.course .what{grid-column:2; color:var(--label); font-size:.95rem}
.course .here{font-family:var(--sans); font-weight:400; font-size:.72rem; background:var(--ink); color:var(--page); border-radius:999px; padding:3px 10px; margin-left:8px; vertical-align:middle; white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="#start">Top Note Society</a>
  <main id="app" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>

<script>
(function(){
"use strict";

/* ---------- content (from the workbook, Module 1: Citrus) ---------- */
var OILS=[
  {id:"lemon",name:"Lemon",tint:"#E8D86A"},
  {id:"lime",name:"Lime",tint:"#B9CF7E"},
  {id:"bergamot",name:"Bergamot",tint:"#D3D98A"},
  {id:"orange",name:"Sweet orange",tint:"#EFBE7A"},
  {id:"grapefruit",name:"Grapefruit",tint:"#EDAA98"}
];
var OIL={}; OILS.forEach(function(o){OIL[o.id]=o;});

var WORDS=[
  {w:"Zesty",m:"the oily spray when you twist a peel"},
  {w:"Juicy",m:"the flesh, not the peel"},
  {w:"Tart",m:"sour that makes you blink",near:"Acidulated"},
  {w:"Green",m:"leaf and stem"},
  {w:"Pithy",m:"the white, bitter layer under the peel",near:"Bitter"},
  {w:"Bitter",m:"the taste of the pith, as a smell; grapefruit, bergamot",near:"Pithy"},
  {w:"Round",m:"no sharp edges; sweet orange"},
  {w:"Sparkling",m:"lifts and fizzes"},
  {w:"Floral",m:"bergamot, “citrus wearing perfume”"},
  {w:"Sulphurous",m:"grapefruit’s almost sweaty edge"},
  {w:"Candied",m:"cooked, sugary citrus"},
  {w:"Fleeting",m:"gone in minutes: why citrus sits at the top of a perfume"},
  {w:"Transparent",m:"light and clear, you can “see through” it; lemon next to mandarin"},
  {w:"Acidulated",m:"slightly sour, like a drop of juice; the perfumer’s word for lemon’s bite",near:"Tart"}
];

var PAIRS=[
  {a:"lemon",b:"lime",how:"Smell lemon, then lime, then lemon again.",q:[
    {t:"Greener, colder and sharper",ans:"lime",note:"Next to lemon, lime feels greener, colder and sharper, with a slight bitterness."},
    {t:"Bright, juicy, transparent: the “yellow” of citrus",ans:"lemon",note:"Lemon is the transparent one. Perfumers use it in the top notes of colognes."},
    {t:"A classic part of cola flavourings",ans:"lime",note:"Lime oil sits in cola next to cinnamon and vanilla."}
  ]},
  {a:"bergamot",b:"orange",how:"Smell bergamot, then sweet orange, then bergamot again.",q:[
    {t:"“Citrus wearing perfume”: floral and softly bitter",ans:"bergamot",note:"Bergamot leans floral and tea-like. It is the backbone of colognes and chypres."},
    {t:"Round, sweet, juicy, almost sugary",ans:"orange",note:"Sweet orange has no sharp edges and very little bitterness."},
    {t:"The scent in a cup of Earl Grey",ans:"bergamot",note:"Earl Grey is black tea scented with bergamot oil. Brew one and smell it next to the strip."}
  ]},
  {a:"grapefruit",b:"lemon",how:"Smell grapefruit, then lemon, then grapefruit again.",q:[
    {t:"A sulphurous, almost sweaty edge",ans:"grapefruit",note:"Both are sharp, but only grapefruit has that sulphurous edge."},
    {t:"Clear and juicy, without the bitter pith",ans:"lemon",note:"Next to grapefruit, lemon stays light and transparent. Pithy and bitter are grapefruit words."},
    {t:"Its character comes from nootkatone, a close cousin of the molecules in vetiver",ans:"grapefruit",note:"That is why grapefruit and vetiver sit so well together in a perfume."}
  ]}
];
var QUESTIONS=[];
PAIRS.forEach(function(p){p.q.forEach(function(q){QUESTIONS.push({pair:p,q:q});});});

var AXES=["Fresh","Sweet","Bitter","Green","Sharp","Warm"];

var REVIEWS=[
  {n:1,when:"After 1 day",todo:"Blind test with all five strips.",go:"blind"},
  {n:3,when:"After 3 days",todo:"Smell the three pairs; say the difference out loud.",go:"pairs"},
  {n:7,when:"After 1 week",todo:"Word bank: match each word to its meaning, then to an oil.",go:"words"},
  {n:30,when:"After 1 month",todo:"Blind test again; fill in a new intensity scale and compare.",go:"scale"}
];

var WORKBOOK_URL="https://top-note-society.kit.com/35f4e9b2e7";

/* ---------- storage: saved on this device, safe if unavailable ---------- */
var mem={};
var store={
  get:function(k,d){
    try{var v=localStorage.getItem("fis1:"+k); if(v!==null) return JSON.parse(v);}catch(e){}
    return (k in mem)?mem[k]:d;
  },
  set:function(k,v){
    mem[k]=v;
    try{localStorage.setItem("fis1:"+k,JSON.stringify(v));}catch(e){}
  },
  clear:function(){
    mem={};
    ["own","pairs","words","scale","blind","review"].forEach(function(k){
      try{localStorage.removeItem("fis1:"+k);}catch(e){}
    });
  }
};

/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fromIso(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function nice(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});}
function daysFromToday(d){return Math.round((d-today())/86400000);}
function relative(n){
  if(n===0) return "today";
  if(n===1) return "tomorrow";
  if(n===-1) return "yesterday";
  return n>0?("in "+n+" days"):(Math.abs(n)+" days ago");
}
function oilBtn(o,cls,extra){
  return '<button class="opt '+(cls||"")+'" '+(extra||"")+' style="--tint:'+o.tint+'"><span class="dot"></span>'+o.name+'</button>';
}
var app=document.getElementById("app");
var foot=document.getElementById("foot");
function head(step,title,intro){
  return '<a class="back" href="#start">‹ All exercises</a>'+
    '<p class="tag">'+step+'</p><h1 class="small">'+title+'</h1>'+
    (intro?'<p class="lead">'+intro+'</p>':'');
}

/* ---------- start page ---------- */
function statusPairs(){var b=store.get("pairs",null);return b?("Best: "+b.best+" of "+QUESTIONS.length):"Not started";}
function statusWords(){var b=store.get("words",null);return b?("Best: "+b.best+" of "+WORDS.length+" on the first try"):"Not started";}
function countScale(s){var n=0;if(!s||!s.current)return 0;OILS.forEach(function(o){AXES.forEach(function(a){if(s.current.v[o.id]&&s.current.v[o.id][a])n++;});});return n;}
function statusScale(){var n=countScale(store.get("scale",null));return n?(n+" of 30 rated"):"Not started";}
function statusBlind(){var h=store.get("blind",[]);if(!h.length)return "Not started";var l=h[h.length-1];return "Last test: "+l.right+" of 5 ("+nice(fromIso(l.date))+")";}
function statusReview(){
  var r=store.get("review",null); if(!r||!r.start) return "No dates yet";
  var next=null;
  REVIEWS.forEach(function(x){if(!next&&!(r.done&&r.done[x.n]))next=x;});
  if(!next) return "All four reviews done";
  var d=addDays(fromIso(r.start),next.n), n=daysFromToday(d);
  if(n<0) return "Review waiting since "+nice(d);
  return "Next review: "+nice(d)+" ("+relative(n)+")";
}
function viewStart(){
  var rs=[-14,-7,0,7,14];
  var strips=OILS.map(function(o,i){
    return '<a class="strip" href="#own" aria-label="Write your own words for '+o.name+'" style="--r:'+rs[i]+'deg;--tint:'+o.tint+'"><span>'+o.name+'</span></a>';
  }).join("");
  var items=[
    ["own","Step 1","Your own words first","Write what each oil reminds you of. No wrong answers.",statusOwn()],
    ["pairs","Step 3","Minimal pairs","Two neighbours side by side. Which one is it?",statusPairs()],
    ["scale","Step 4","Intensity scale","Rate each oil from 1 to 5 on six fixed axes.",statusScale()],
    ["words","Step 5","Word bank","Fourteen words. Match each one to its meaning.",statusWords()],
    ["blind","Step 6","Blind test","Numbered strips, your guess, three words.",statusBlind()],
    ["review","Step 8","Come back","Your four review dates, counted for you.",statusReview()]
  ];
  app.innerHTML=
    '<div class="strips">'+strips+'</div>'+
    '<p class="hint">Tap a strip to write on it.</p>'+
    '<p class="tag">A perfume school at home</p>'+
    '<h1>Fluent in Scent</h1>'+
    '<p class="lead">A complete perfumery course, at home and at your own pace. Five stages take you from single materials to describing whole perfumes, with a real teaching method: small steps, your own words first, practice and regular review.</p>'+
    '<p>You are in Module 1: Citrus. Keep your five strips next to you: lemon, lime, bergamot, sweet orange, grapefruit.</p>'+
    '<ul class="list">'+items.map(function(x){
      return '<li><a href="#'+x[0]+'"><span class="step">'+x[1]+'</span><span class="name">'+x[2]+'</span>'+
        '<span class="what">'+x[3]+'</span><span class="status">'+x[4]+'</span></a></li>';
    }).join("")+'</ul>'+
    '<h2 style="margin-top:44px">The full course</h2>'+
    '<p class="quiet" style="margin:6px 0 14px">Five stages, mapped to language levels A1 to C1. Each module adds a few oils to your own library.</p>'+
    '<ol class="course">'+[
      ["A1","Alphabet","Single raw materials, smelled in pairs. Citrus, herbs and aromatics.","You are here"],
      ["A2","Vocabulary","Descriptors: texture, temperature, light, shape. Flowers, spices.",""],
      ["B1","Grammar","Top, heart, base; accords; families. Woods, resins and balsams, musks.",""],
      ["B2","Translation","Parallels across domains: cinnamon and cola, iris and carrot. Gourmands, animalics and leather.",""],
      ["C1","Fluency","Describing and comparing finished perfumes. Blind tests, reviews, your own scent dictionary.",""]
    ].map(function(x){
      return '<li><span class="lvl">'+x[0]+'</span><span class="name">'+x[1]+(x[3]?' <span class="here">'+x[3]+'</span>':'')+'</span><span class="what">'+x[2]+'</span></li>';
    }).join("")+'</ol>'+
    '<p class="quiet" style="margin-top:22px">Smell from paper, a few centimetres from the nose. Never put undiluted oil on skin.</p>';
}

/* ---------- step 1: your own words ---------- */
var PORTRAITS={
  lemon:["Bright, juicy, transparent; the “yellow” of citrus","Top notes of colognes; Dior Eau Sauvage"],
  lime:["Greener, sharper, colder than lemon, with a slight bitterness","Fresh and tropical tops; cola and cocktail accords"],
  bergamot:["Citrus that leans floral and tea-like, softly bitter","The backbone of colognes and chypres; Earl Grey tea"],
  orange:["Round, sweet, juicy, almost sugary; little bitterness","Cheerful, sunny tops; gourmand citrus"],
  grapefruit:["Sharp, bitter, a little sulphurous, “pink”","Modern fresh scents; Terre d’Hermès"]
};
var ownShow=false;
function getOwn(){var o=store.get("own",null);return (o&&typeof o==="object")?o:{};}
function ownCount(o){var n=0;OILS.forEach(function(x){if(o[x.id]&&String(o[x.id]).trim())n++;});return n;}
function statusOwn(){var n=ownCount(getOwn());return n?(n+" of 5 written"):"Not started";}
function viewOwn(){
  var o=getOwn(), n=ownCount(o), open=ownShow&&n===5;
  app.innerHTML=head("Step 1","Your own words first","Put a drop or two of each oil on its paper strip. Smell, then write what comes to mind: a memory, a place, a colour, a food. No wrong answers.")+
    '<p class="progress" id="own-count">'+n+' of 5 written · saved as you write</p>'+
    OILS.map(function(x){
      return '<div class="pstrip" style="--tint:'+x.tint+'"><label for="own-'+x.id+'">'+x.name+'</label>'+
        '<textarea id="own-'+x.id+'" data-own="'+x.id+'" rows="2" placeholder="It reminds me of…"></textarea></div>'+
        (open?'<p class="pro"><strong>Perfumers say:</strong> '+PORTRAITS[x.id][0]+'.<br><strong>Where they use it:</strong> '+PORTRAITS[x.id][1]+'.</p>':'');
    }).join("")+
    (open?'<div class="note"><p>Which of their words did you already use?</p></div>':
      '<div class="row"><button class="btn" id="own-btn" data-act="own-show" '+(n===5?"":"disabled")+'>How professionals say it</button></div>'+
      '<p class="quiet" style="margin-top:12px">Step 2 opens when all five strips are written.</p>');
  OILS.forEach(function(x){var t=document.getElementById("own-"+x.id); if(t) t.value=o[x.id]||"";});
}

/* ---------- step 3: minimal pairs ---------- */
var P=null;
function pairsNew(){P={i:0,score:0,picked:null,done:false};}
function viewPairs(){
  if(!P) pairsNew();
  if(P.done){
    app.innerHTML=head("Step 3","Minimal pairs")+
      '<p class="big">'+P.score+' of '+QUESTIONS.length+'</p>'+
      '<p>'+(P.score===QUESTIONS.length?"Every pair told apart. Now try it with your eyes closed and the strips in your hand.":"The pairs you missed are the ones to smell again: both strips, slowly, and say the difference out loud.")+'</p>'+
      '<div class="row"><button class="btn" data-act="pairs-again">Practise again</button><a class="btn ghost" href="#start" style="text-decoration:none;display:inline-flex;align-items:center">All exercises</a></div>';
    return;
  }
  var cur=QUESTIONS[P.i], p=cur.pair, q=cur.q, A=OIL[p.a], B=OIL[p.b];
  function b(o){
    var cls="",ex='data-act="pairs-pick" data-id="'+o.id+'"';
    if(P.picked){
      ex+=" disabled";
      if(o.id===q.ans) cls="right"; else if(o.id===P.picked) cls="wrong"; else cls="dim";
    }
    return oilBtn(o,cls,ex);
  }
  var fb="";
  if(P.picked){
    var ok=P.picked===q.ans;
    fb='<div class="note"><p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Right.":"Not this one. It is "+OIL[q.ans].name.toLowerCase()+".")+'</p><p>'+q.note+'</p></div>'+
      '<div class="row"><button class="btn" data-act="pairs-next">'+(P.i===QUESTIONS.length-1?"See the result":"Next")+'</button></div>';
  }
  app.innerHTML=head("Step 3","Minimal pairs")+
    '<p class="progress">Question '+(P.i+1)+' of '+QUESTIONS.length+' · '+A.name+' or '+B.name.toLowerCase()+'</p>'+
    '<p class="quiet">'+p.how+' Then answer.</p>'+
    '<p class="prompt">'+q.t+'</p>'+
    '<div class="opts">'+b(A)+b(B)+'</div>'+fb;
}

/* ---------- step 5: word bank ---------- */
var W=null;
function wordsOpts(){
  var c=W.queue[W.pos], cw=WORDS[c];
  var pool=[];
  WORDS.forEach(function(x,i){if(i!==c&&x.w!==cw.near)pool.push(i);});
  W.opts=shuffle([c].concat(shuffle(pool).slice(0,3)));
  W.picked=null;
}
function wordsNew(){
  W={queue:shuffle(WORDS.map(function(_,i){return i;})),pos:0,first:0,learned:0,seen:{},missed:[],done:false};
  wordsOpts();
}
function wordList(){
  return '<dl class="words">'+WORDS.map(function(x){return '<div><dt>'+x.w+'</dt><dd>'+x.m+'</dd></div>';}).join("")+'</dl>'+
    '<div class="note" style="margin-top:18px"><p class="verdict">Easily confused</p>'+
    '<p><strong>Citrusy</strong> means it smells like citrus fruit: the peel, the zest. <strong>Citric</strong> means sour, like citric acid, which itself has no smell. A scent can feel citric without a single citrus in it: think of rhubarb.</p></div>';
}
function viewWords(){
  if(!W) wordsNew();
  if(W.done){
    var missed=W.missed.length?('<p>Words to smell again:</p><dl class="words">'+W.missed.map(function(i){return '<div><dt>'+WORDS[i].w+'</dt><dd>'+WORDS[i].m+'</dd></div>';}).join("")+'</dl>'):
      '<p>All fourteen on the first try. Next: say each word with the right strip under your nose.</p>';
    app.innerHTML=head("Step 5","Word bank")+
      '<p class="big">'+W.first+' of '+WORDS.length+' on the first try</p>'+missed+
      '<div class="row"><button class="btn" data-act="words-again">Practise again</button><a class="btn ghost" href="#start" style="text-decoration:none;display:inline-flex;align-items:center">All exercises</a></div>';
    return;
  }
  var c=W.queue[W.pos], cw=WORDS[c];
  var opts=W.opts.map(function(i){
    var cls="",ex='data-act="words-pick" data-i="'+i+'"';
    if(W.picked!==null){
      ex+=" disabled";
      if(i===c) cls="right"; else if(i===W.picked) cls="wrong"; else cls="dim";
    }
    return '<button class="opt '+cls+'" '+ex+'>'+WORDS[i].w+'</button>';
  }).join("");
  var fb="";
  if(W.picked!==null){
    var ok=W.picked===c;
    fb='<div class="note"><p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Right.":"Not this one. This word will come back.")+'</p>'+
      '<p><strong>'+cw.w+'</strong>: '+cw.m+'.</p></div>'+
      '<div class="row"><button class="btn" data-act="words-next">'+(W.pos===W.queue.length-1?"See the result":"Next word")+'</button></div>';
  }
  app.innerHTML=head("Step 5","Word bank")+
    '<p class="progress">'+W.learned+' of '+WORDS.length+' words matched</p>'+
    '<p class="quiet">Which word means this?</p>'+
    '<p class="prompt">'+cw.m.charAt(0).toUpperCase()+cw.m.slice(1)+'</p>'+
    '<div class="opts">'+opts+'</div>'+fb+
    '<details><summary>See all fourteen words</summary>'+wordList()+'</details>';
}

/* ---------- step 4: intensity scale ---------- */
function emptyScale(){var v={};OILS.forEach(function(o){v[o.id]={};});return {date:iso(today()),v:v};}
function getScale(){var s=store.get("scale",null);if(!s||!s.current){s={current:emptyScale(),previous:null};}return s;}
function viewScale(){
  var s=getScale(), n=countScale(s);
  var body=OILS.map(function(o){
    return '<section class="oil"><h2 style="--tint:'+o.tint+'"><span class="dot"></span>'+o.name+'</h2>'+
      AXES.map(function(a){
        var cur=s.current.v[o.id][a]||0, was=s.previous&&s.previous.v[o.id]?(s.previous.v[o.id][a]||0):0;
        var dots="";
        for(var k=1;k<=5;k++){
          dots+='<button class="d'+(was===k?" was":"")+'" data-act="scale-set" data-oil="'+o.id+'" data-axis="'+a+'" data-v="'+k+'" aria-pressed="'+(cur===k)+'" aria-label="'+o.name+', '+a.toLowerCase()+': '+k+(was===k?" (your last rating)":"")+'"><i>'+k+'</i></button>';
        }
        return '<div class="axis"><span class="ax">'+a+'</span><div class="dots">'+dots+'</div></div>';
      }).join("")+'</section>';
  }).join("");
  app.innerHTML=head("Step 4","Intensity scale","Rate each oil from 1 (not at all) to 5 (very). The same six axes come back in every module, so over time you get a map of your own nose.")+
    '<p class="progress" id="scale-count">'+n+' of 30 rated · saved as you go</p>'+
    (s.previous?'<p class="quiet">The ring shows your rating from '+nice(fromIso(s.previous.date))+'.</p>':'')+
    body+
    '<div class="row"><button class="btn ghost" data-act="scale-new" '+(n?"":"disabled")+'>Start a new scale</button></div>'+
    '<p class="quiet" style="margin-top:12px">Start a new one after a month. Your ratings from today stay visible as rings, so you can compare.</p>';
}

/* ---------- step 6: blind test ---------- */
var B=null;
function blindNew(){B={step:0,rows:[0,1,2,3,4].map(function(){return {guess:null,words:[],right:null};})};}
function blindHistory(){
  var h=store.get("blind",[]); if(!h.length) return "";
  return '<details open><summary>Your tests</summary><ul class="hist">'+h.slice().reverse().map(function(x){
    return '<li><span>'+nice(fromIso(x.date))+'</span><span>'+x.right+' of 5 right</span></li>';
  }).join("")+'</ul></details>';
}
function viewBlind(){
  if(!B) blindNew();
  if(B.step===6){
    var r=B.rows.filter(function(x){return x.right===true;}).length;
    app.innerHTML=head("Step 6","Blind test")+
      '<p class="big">'+r+' of 5 right</p>'+
      '<p>Saved. Swap the numbers and repeat tomorrow: the second day is where the names start to stick.</p>'+
      '<div class="row"><button class="btn" data-act="blind-again">Start another test</button><a class="btn ghost" href="#start" style="text-decoration:none;display:inline-flex;align-items:center">All exercises</a></div>'+
      blindHistory();
    return;
  }
  if(B.step===5){
    var all=B.rows.every(function(x){return x.right!==null;});
    app.innerHTML=head("Step 6","Blind test")+
      '<p class="progress">Check the answers</p>'+
      '<p class="quiet">Ask which oil was on each strip, then mark your guess.</p>'+
      '<ul class="check">'+B.rows.map(function(x,i){
        return '<li><div class="guess">No. '+(i+1)+': '+OIL[x.guess].name+'</div>'+
          (x.words.length?'<div class="w">'+x.words.join(", ").toLowerCase()+'</div>':'')+
          '<div class="yn"><button data-act="blind-mark" data-i="'+i+'" data-v="1" aria-pressed="'+(x.right===true)+'">Right</button>'+
          '<button data-act="blind-mark" data-i="'+i+'" data-v="0" aria-pressed="'+(x.right===false)+'">Wrong</button></div></li>';
      }).join("")+'</ul>'+
      '<div class="row"><button class="btn ghost" data-act="blind-back">Back</button><button class="btn" data-act="blind-save" '+(all?"":"disabled")+'>Save this test</button></div>';
    return;
  }
  var row=B.rows[B.step];
  var guesses=OILS.map(function(o){
    return '<button class="chip" data-act="blind-guess" data-id="'+o.id+'" aria-pressed="'+(row.guess===o.id)+'">'+o.name+'</button>';
  }).join("");
  var full=row.words.length>=3;
  var chips=WORDS.map(function(x){
    var on=row.words.indexOf(x.w)>-1;
    return '<button class="chip" data-act="blind-word" data-w="'+x.w+'" aria-pressed="'+on+'" '+(!on&&full?"disabled":"")+'>'+x.w+'</button>';
  }).join("");
  app.innerHTML=head("Step 6","Blind test",B.step===0?"Ask someone to put two drops of each oil on numbered paper strips. Name each one, then describe it in three words.":"")+
    '<p class="progress">Strip '+(B.step+1)+' of 5</p>'+
    '<p class="tag field">My guess</p><div class="chips">'+guesses+'</div>'+
    '<p class="tag field">Three words ('+row.words.length+' of 3)</p><div class="chips">'+chips+'</div>'+
    '<div class="row">'+(B.step>0?'<button class="btn ghost" data-act="blind-back">Back</button>':'')+
    '<button class="btn" data-act="blind-next" '+(row.guess?"":"disabled")+'>'+(B.step===4?"Check the answers":"Next strip")+'</button></div>'+
    (B.step===0?blindHistory():"");
}

/* ---------- step 8: come back ---------- */
function viewReview(){
  var r=store.get("review",null);
  var top=head("Step 8","Come back","Smells are forgotten fast, words too. A short review at the right moment is what makes them stay. Ten minutes each time is enough.");
  if(!r||!r.start){
    app.innerHTML=top+
      '<p>When did you finish the steps of Module 1?</p>'+
      '<div class="row" style="align-items:center"><button class="btn" data-act="review-today">Today</button>'+
      '<label class="sans" style="font-size:.9rem;display:flex;align-items:center;gap:10px">or another day <input type="date" id="rev-date" max="'+iso(today())+'"></label></div>';
    return;
  }
  var start=fromIso(r.start);
  app.innerHTML=top+
    '<p class="progress">Module 1 finished on '+nice(start)+'</p>'+
    '<ul class="rev">'+REVIEWS.map(function(x){
      var d=addDays(start,x.n), n=daysFromToday(d), done=!!(r.done&&r.done[x.n]);
      var due=done?"Done":(n===0?"Today":(n<0?"Waiting since "+relative(n):relative(n).charAt(0).toUpperCase()+relative(n).slice(1)));
      return '<li class="'+(done?"done":"")+'"><span class="when">'+x.when+' · <span class="due">'+due+'</span></span>'+
        '<span class="date">'+nice(d)+'</span>'+
        '<span class="todo">'+x.todo+' <a href="#'+x.go+'">Open</a></span>'+
        '<label><input type="checkbox" data-act="review-done" data-n="'+x.n+'" '+(done?"checked":"")+'> Done</label></li>';
    }).join("")+'</ul>'+
    '<div class="row"><button class="link" data-act="review-reset">Change the start date</button></div>';
}

/* ---------- actions ---------- */
var actions={
  "own-show":function(){if(ownCount(getOwn())===5){ownShow=true;viewOwn();}},
  "pairs-pick":function(el){
    if(P.picked) return;
    P.picked=el.dataset.id;
    if(P.picked===QUESTIONS[P.i].q.ans) P.score++;
    viewPairs();
  },
  "pairs-next":function(){
    if(P.i===QUESTIONS.length-1){
      P.done=true;
      var b=store.get("pairs",null);
      store.set("pairs",{best:Math.max(P.score,b?b.best:0),date:iso(today())});
    }else{P.i++;P.picked=null;}
    viewPairs(); window.scrollTo(0,0);
  },
  "pairs-again":function(){pairsNew();viewPairs();},
  "words-pick":function(el){
    if(W.picked!==null) return;
    var i=+el.dataset.i, c=W.queue[W.pos];
    W.picked=i;
    if(i===c){W.learned++; if(!W.seen[c]) W.first++;}
    else{ if(W.missed.indexOf(c)<0) W.missed.push(c); W.queue.push(c); }
    W.seen[c]=true;
    viewWords();
  },
  "words-next":function(){
    if(W.pos===W.queue.length-1){
      W.done=true;
      var b=store.get("words",null);
      store.set("words",{best:Math.max(W.first,b?b.best:0),date:iso(today())});
    }else{W.pos++;wordsOpts();}
    viewWords(); window.scrollTo(0,0);
  },
  "words-again":function(){wordsNew();viewWords();},
  "scale-set":function(el){
    var s=getScale(), o=el.dataset.oil, a=el.dataset.axis, v=+el.dataset.v;
    if(!s.current.v[o]) s.current.v[o]={};
    var same=s.current.v[o][a]===v;
    if(same) delete s.current.v[o][a]; else s.current.v[o][a]=v;
    s.current.date=iso(today());
    store.set("scale",s);
    var sibs=el.parentNode.querySelectorAll(".d");
    for(var i=0;i<sibs.length;i++) sibs[i].setAttribute("aria-pressed",(!same&&sibs[i]===el)?"true":"false");
    var n=countScale(s);
    document.getElementById("scale-count").textContent=n+" of 30 rated · saved as you go";
    var nb=app.querySelector('[data-act="scale-new"]'); if(nb) nb.disabled=!n;
  },
  "scale-new":function(){
    var s=getScale(); if(!countScale(s)) return;
    store.set("scale",{current:emptyScale(),previous:s.current});
    viewScale(); window.scrollTo(0,0);
  },
  "blind-guess":function(el){B.rows[B.step].guess=el.dataset.id;viewBlind();},
  "blind-word":function(el){
    var ws=B.rows[B.step].words, w=el.dataset.w, i=ws.indexOf(w);
    if(i>-1) ws.splice(i,1); else if(ws.length<3) ws.push(w);
    viewBlind();
  },
  "blind-next":function(){if(B.rows[B.step].guess){B.step++;viewBlind();window.scrollTo(0,0);}},
  "blind-back":function(){if(B.step>0){B.step--;viewBlind();window.scrollTo(0,0);}},
  "blind-mark":function(el){B.rows[+el.dataset.i].right=el.dataset.v==="1";viewBlind();},
  "blind-save":function(){
    if(!B.rows.every(function(x){return x.right!==null;})) return;
    var h=store.get("blind",[]);
    h.push({date:iso(today()),right:B.rows.filter(function(x){return x.right;}).length,rows:B.rows});
    store.set("blind",h.slice(-30));
    B.step=6; viewBlind(); window.scrollTo(0,0);
  },
  "blind-again":function(){blindNew();viewBlind();window.scrollTo(0,0);},
  "review-today":function(){store.set("review",{start:iso(today()),done:{}});viewReview();},
  "review-reset":function(){store.set("review",null);viewReview();},
  "review-done":function(el){
    var r=store.get("review",null); if(!r) return;
    r.done=r.done||{}; r.done[el.dataset.n]=el.checked;
    store.set("review",r); viewReview();
  },
  "clear":function(el){
    if(el.dataset.sure!=="1"){el.dataset.sure="1";el.textContent="Tap again to clear everything on this device";return;}
    store.clear(); P=W=B=null; ownShow=false; show(cur); renderFoot();
  }
};
document.addEventListener("input",function(e){
  var el=e.target; if(!el.dataset||!el.dataset.own) return;
  var o=getOwn(); o[el.dataset.own]=el.value; store.set("own",o);
  var n=ownCount(o), c=document.getElementById("own-count"), b=document.getElementById("own-btn");
  if(c) c.textContent=n+" of 5 written · saved as you write";
  if(b) b.disabled=n!==5;
});
document.addEventListener("click",function(e){
  var a=e.target.closest('a[href^="#"]');
  if(a){e.preventDefault();go(a.getAttribute("href").slice(1));return;}
  var el=e.target.closest("[data-act]");
  if(!el||el.disabled||el.type==="checkbox") return;
  var f=actions[el.dataset.act]; if(f) f(el);
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="rev-date"&&el.value){store.set("review",{start:el.value,done:{}});viewReview();}
  else if(el.type==="checkbox"&&el.dataset.act){var f=actions[el.dataset.act]; if(f) f(el);}
});

/* ---------- footer + routing ---------- */
function renderFoot(){
  foot.innerHTML=
    '<p>No workbook yet? <a href="'+WORKBOOK_URL+'" target="_blank" rel="noopener">Get Module 1: Citrus, free</a>.</p>'+
    '<p>Your answers are saved on this device only. We never see them.</p>'+
    '<button class="link" data-act="clear">Clear my answers</button>';
}
var views={start:viewStart,own:viewOwn,pairs:viewPairs,scale:viewScale,words:viewWords,blind:viewBlind,review:viewReview};
var cur="start";
function show(name){cur=views[name]?name:"start";views[cur]();}
function go(name){
  show(name);
  try{if(location.hash!=="#"+cur) location.hash=cur;}catch(e){}
  window.scrollTo(0,0);
}
function hashName(){
  var h="";
  try{h=(location.hash||"").replace(/^#/,"");}catch(e){}
  return views[h]?h:"start";
}
function route(){show(hashName());}
window.addEventListener("hashchange",function(){if(hashName()!==cur){route();window.scrollTo(0,0);}});
renderFoot();
route();
})();
</script>
</body>
</html>
